name: Bandeco CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: bandeco-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # TEST
  # ============================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          pytest \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40

      - name: Upload coverage report
        if: github.ref_name == 'main'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false


  # ============================================================
  # LINT
  # ============================================================
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check src/ tests/


  # ============================================================
  # DOCKER BUILD + GHCR
  # ============================================================
  docker-build:
    runs-on: ubuntu-latest

    needs:
      - test
      - lint

    # Só publica imagens em push.
    # Pull Requests apenas fazem o build para validação.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Define Docker tag
      # ----------------------------------------------------------
      - name: Define Docker image
        id: image
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=develop" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/jonascardoso/bandeco-unicamp:${{ steps.image.outputs.tag }} \
            -t ghcr.io/jonascardoso/bandeco-unicamp:${{ github.sha }} \
            .

      # ----------------------------------------------------------
      # Push
      # ----------------------------------------------------------
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            ghcr.io/jonascardoso/bandeco-unicamp:${{ steps.image.outputs.tag }}

          docker push \
            ghcr.io/jonascardoso/bandeco-unicamp:${{ github.sha }}


  # ============================================================
  # DEPLOY DEVELOPMENT
  # ============================================================
  deploy-development:
    runs-on: self-hosted

    needs:
      - test
      - lint
      - docker-build

    # SOMENTE push na develop
    if: github.event_name == 'push' && github.ref_name == 'develop'

    environment:
      name: development

    steps:

      - name: Check Komodo
        run: |
          curl --fail --silent \
            http://localhost:9120 \
            > /dev/null

      - name: Deploy Development Stack
        env:
          KOMODO_URL: http://localhost:9120
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          curl --fail-with-body \
            -X POST \
            "${KOMODO_URL}/execute/DeployStack" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${KOMODO_API_KEY}" \
            -H "X-Api-Secret: ${KOMODO_API_SECRET}" \
            -d '{
              "stack": "bandeco-unicamp-develop",
              "stop_time": null
            }'


  # ============================================================
  # DEPLOY PRODUCTION
  # ============================================================
  deploy-production:
    runs-on: self-hosted

    needs:
      - test
      - lint
      - docker-build

    # SOMENTE push na main
    if: github.event_name == 'push' && github.ref_name == 'main'

    environment:
      name: production

    steps:

      - name: Check Komodo
        run: |
          curl --fail --silent \
            http://localhost:9120 \
            > /dev/null

      - name: Deploy Production Stack
        env:
          KOMODO_URL: http://localhost:9120
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          curl --fail-with-body \
            -X POST \
            "${KOMODO_URL}/execute/DeployStack" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${KOMODO_API_KEY}" \
            -H "X-Api-Secret: ${KOMODO_API_SECRET}" \
            -d '{
              "stack": "bandeco-unicamp-main",
              "stop_time": null
            }'