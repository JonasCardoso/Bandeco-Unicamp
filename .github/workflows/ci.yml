name: Bandeco CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # TEST
  # ============================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40

      - name: Upload coverage report
        if: github.ref_name == 'main'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false


  # ============================================================
  # LINT
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.16.4

      - name: Run Ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/


  # ============================================================
  # DOCKER BUILD + GHCR
  # ============================================================
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    needs:
      - test
      - lint

    # Só publica imagens em push.
    # Pull Requests apenas fazem o build para validação.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Define Docker tag
      # ----------------------------------------------------------
      - name: Define Docker image
        id: image
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and optionally publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/jonascardoso/bandeco-unicamp:${{ steps.image.outputs.tag }}
            ghcr.io/jonascardoso/bandeco-unicamp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: ${{ github.event_name == 'push' }}


  # ============================================================
  # DEPLOY DEVELOPMENT
  # ============================================================
  deploy-development:
    runs-on: self-hosted
    timeout-minutes: 10

    needs:
      - test
      - lint
      - docker-build

    # SOMENTE push na develop
    if: github.event_name == 'push' && github.ref_name == 'develop'

    environment:
      name: development

    steps:

      - name: Check Komodo
        run: |
          curl --fail --silent \
            http://localhost:9120 \
            > /dev/null

      - name: Deploy Development Stack
        env:
          KOMODO_URL: http://localhost:9120
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          curl --fail-with-body \
            -X POST \
            "${KOMODO_URL}/execute/DeployStack" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${KOMODO_API_KEY}" \
            -H "X-Api-Secret: ${KOMODO_API_SECRET}" \
            -d '{
              "stack": "bandeco-unicamp-develop",
              "stop_time": null
            }'


  # ============================================================
  # DEPLOY PRODUCTION
  # ============================================================
  deploy-production:
    runs-on: self-hosted
    timeout-minutes: 10

    needs:
      - test
      - lint
      - docker-build

    # SOMENTE push na main
    if: github.event_name == 'push' && github.ref_name == 'main'

    environment:
      name: production

    steps:

      - name: Check Komodo
        run: |
          curl --fail --silent \
            http://localhost:9120 \
            > /dev/null

      - name: Deploy Production Stack
        env:
          KOMODO_URL: http://localhost:9120
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          curl --fail-with-body \
            -X POST \
            "${KOMODO_URL}/execute/DeployStack" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${KOMODO_API_KEY}" \
            -H "X-Api-Secret: ${KOMODO_API_SECRET}" \
            -d '{
              "stack": "bandeco-unicamp-main",
              "stop_time": null
            }'