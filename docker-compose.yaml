services:
  bandeco:
    image: ghcr.io/jonascardoso/bandeco-unicamp:latest
    container_name: bandeco-unicamp-main
    init: true
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - nutrition-cache:/bandeco/.cache_bandeco_nutricao
      - model-cache:/home/bandeco/.cache/huggingface

volumes:
  nutrition-cache:
  model-cache:
